<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ตรวจสอบผลการเรียน ป.6</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f5f6fa;
      text-align:center;
      margin:0;
      padding:0;
    }

    .container{
      width:800px;
      max-width:90%;
      margin:80px auto;
      background:white;
      padding:30px;
      box-shadow:0 0 15px rgba(0,0,0,0.1);
      border-radius:10px;
    }

    input{
      padding:10px;
      width:70%;
      font-size:16px;
      margin-bottom:10px;
    }

    button{
      padding:10px 20px;
      background:#1976d2;
      color:white;
      border:none;
      border-radius:6px;
      cursor:pointer;
      font-size:16px;
      margin-bottom:20px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
      table-layout: fixed;
    }

    th, td{
      border:1px solid #ddd;
      padding:8px;
    }

    th{
      background:#7CFC00;
      color:black;
    }

    .info{
      margin-top:20px;
      margin-bottom:10px;
      font-size:20px;
      font-weight:bold;
    }

    #studentYear{
      font-size:16px;
      font-weight:normal;
      margin-top:5px;
      margin-bottom:15px;
    }

    .rank-text{
      text-align:left;
      font-weight:bold;
      font-size:18px;
      margin-top:12px;
    }

    .pass{ font-weight:bold; }
    .fail{ color:red; font-weight:bold; }
    .ms{ color:red; font-weight:bold; }
    .absent{ color:red; font-weight:bold; }

    td:nth-child(1), th:nth-child(1){ text-align:center; }
    th:nth-child(2){ text-align:center; }
    td:nth-child(2){ text-align:left; padding-left:15px; }
    td:nth-child(3), th:nth-child(3){ text-align:center; }

    .logo{
      width:120px;
      margin-bottom:15px;
      border-radius:50%;
    }
  </style>
</head>

<body>

<div class="container">
  <img src="logo.png" class="logo">
  <h2>📘 ตรวจสอบผลการเรียน ป.6</h2>

  <input type="text" id="studentId" placeholder="กรอกเลขบัตรประชาชน">
  <br>
  <button onclick="searchStudent()">ค้นหา</button>

  <div id="result" style="display:none;">

    <div class="info">
  <p id="studentInfo"></p>
</div>

<p id="studentYear"></p>
    
    <table>
      <thead>
        <tr>
          <th style="width:20%;">รหัสวิชา</th>
          <th style="width:50%;">ชื่อวิชา</th>
          <th style="width:30%;">คะแนน</th>
        </tr>
      </thead>
      <tbody id="gradeTableBody"></tbody>
    </table>

    <p class="rank-text" id="studentRank"></p>

    <p id="noteRemark" style="color:red; font-size:14px; font-weight:normal; text-align:left;">
      *หมายเหตุ : เนื่องจากเป็นภาคเรียนที่ 1 ของปีการศึกษา จึงยังไม่สามารถแสดงอันดับที่/ห้องได้
    </p>

  </div>
</div>

<script>
async function searchStudent() {
  const inputId = document.getElementById("studentId").value.trim();

  if (!inputId) {
    alert("กรุณากรอกเลขบัตรประชาชน");
    return;
  }

  const resultDiv = document.getElementById("result");
  const gradeTableBody = document.getElementById("gradeTableBody");

  resultDiv.style.display = "block";
  gradeTableBody.innerHTML = "";

  try {
    // โหลดข้อมูลผลการเรียนเพียงไฟล์เดียว
    const [gradeResponse, activityResponse] = await Promise.all([
      fetch("data/p6.json"),
      fetch("data/passfail_p6.json")
    ]);

    if (!gradeResponse.ok || !activityResponse.ok) {
      throw new Error("โหลดไฟล์ข้อมูลไม่สำเร็จ");
    }

    if (!response.ok) {
      throw new Error(
        `โหลดไฟล์ JSON ไม่สำเร็จ (HTTP ${response.status})`
      );
    }

    const gradeData = await gradeResponse.json();
    const activityData = await activityResponse.json();

    // ค้นหาด้วยเลขบัตรประชาชน
    const studentGrades = gradeData.filter(item => String(item.id).trim() === inputId);
    const studentActivities = activityData.filter(item => String(item.id).trim() === inputId);

    if (studentGrades.length === 0) {
      document.getElementById("studentInfo").innerText =
        "❌ ไม่พบข้อมูล";
      document.getElementById("studentYear").innerText = "";
      document.getElementById("studentRank").innerText = "-";
      return;
    }

    const student = studentGrades[0];

    const name = student.name || "-";
    const yearRoom =
      student.year_room ||
      (student.year && student.room
        ? `ป.${student.year}/${student.room}`
        : "ป.6");

    document.getElementById("studentInfo").innerText =
      `ชื่อ: ${name} ชั้น: ${yearRoom}`;

    document.getElementById("studentYear").innerText =
      "ภาคเรียนที่ 1 ปีการศึกษา 2569";

    document.getElementById("studentRank").innerText =
      `อันดับที่/ห้อง : ${student.class_rank ?? "-"}/${student.total_students ?? "-"}`;

    let rows = "";

    studentGrades.forEach(item => {
      const scoreText = item.score ?? "-";

      rows += `
        <tr>
          <td>${item.subject_code ?? "-"}</td>
          <td>${item.subject_name ?? "-"}</td>
          <td>${scoreText}</td>
        </tr>
      `;
    });

    studentActivities.forEach(item => {
      const activityText = item.result || "-";
      const activityClass = activityText === "ผ่าน" ? "pass" : activityText === "ไม่ผ่าน" ? "fail" : "";
      rows += `
        <tr>
          <td>${item.subject_code ?? "-"}</td>
          <td>${item.subject_name ?? "-"}</td>
          <td class="${activityClass}">${activityText}</td>
        </tr>
      `;
    });

    gradeTableBody.innerHTML = rows;

  } catch (error) {
    console.error("เกิดข้อผิดพลาด:", error);

    document.getElementById("studentInfo").innerText =
      "ไม่สามารถโหลดข้อมูลได้ กรุณาตรวจสอบไฟล์ JSON";

    document.getElementById("studentYear").innerText = "";
    document.getElementById("studentRank").innerText =
      error.message;

    document.getElementById("noteRemark").style.display = "none";
  }
}
</script>

</body>
</html>

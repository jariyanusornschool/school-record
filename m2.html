<body>

<div class="container">
  <img src="logo.png" class="logo">
  <h2><i class="fa-solid fa-clipboard-check education-icon kindergarten"></i> ตรวจสอบผลการเรียน ม.2</h2>

  <input type="text" id="studentId" placeholder="กรอกเลขบัตรประชาชน">
  <br>
  <button onclick="searchStudent()">ค้นหา</button>

  <div id="result" style="display:none;">

    <div class="info">
  <p id="studentName"></p>
</div>

<div class="semester">

    <!-- ตารางผลการเรียนและผลกิจกรรมจากข้อมูลชุดเดียวกัน -->
    <table>
      <thead>
        <tr>
          <th style="width:20%;">รหัสวิชา</th>
          <th style="width:50%;">ชื่อวิชา</th>
          <th style="width:30%;">เกรด / ผลกิจกรรม</th>
        </tr>
      </thead>
      <tbody id="gradeTableBody"></tbody>
    </table>

    <div id="gpaSummary" class="gpa-summary" style="display:none;">
      GPA: <span id="gpaValue">-</span>
      <div id="gpaDetail" class="gpa-detail"></div>
    </div>

    <p id="noteRemark" style="color:red; font-size:18px; text-align:left; padding-left:5px; margin-top:15px; display:none;">
      *หมายเหตุ : GPA จะถูกคำนวณใหม่ เมื่อแก้ไข ร , มส , ขส เรียบร้อยแล้ว
    </p>

</div>

<script>
function normalizeStudentId(value) {
  return String(value ?? "")
    .trim()
    .replace(/[๐-๙]/g, digit => String("๐๑๒๓๔๕๖๗๘๙".indexOf(digit)));
}

// จับคู่หน่วยกิตด้วยรหัสวิชา โดยไม่สนใจช่องว่างภายในรหัส
function normalizeSubjectCode(value) {
  return String(value ?? "").toUpperCase().replace(/\s+/g, "").trim();
}

const subjectCredits = {
  "ท22101": 1.5,
  "ค22101": 1.5,
  "ว22101": 1.5,
  "ว22103-1": 0.5,
  "ส22101": 0.5,
  "ส22102-1": 0.5,
  "ส22103": 0.5,
  "ส22104-1": 0.5,
  "พ22101": 0.5,
  "พ22103-1": 0.5,
  "ศ22101": 1,
  "ง22101": 1,
  "อ22101": 1.5,
  "ง22201": 0.5,
  "I20201": 1,
  "อ22201": 1,
};

function calculateGpa(studentData) {
  let weightedTotal = 0;
  let creditTotal = 0;
  const unmatchedCodes = new Set();

  studentData.forEach(item => {
    const subjectName = String(item.subject_name ?? "").trim();
    const code = normalizeSubjectCode(item.subject_code);
    const scoreText = String(item.score ?? "").trim();
    const grade = Number(scoreText);

    // คิดเฉพาะเกรดตัวเลข 0–4 และไม่รวมกิจกรรม
    if (subjectName.includes("กิจกรรม")) return;
    if (scoreText === "" || !Number.isFinite(grade) || grade < 0 || grade > 4) return;

    if (!Object.prototype.hasOwnProperty.call(subjectCredits, code)) {
      unmatchedCodes.add(String(item.subject_code ?? "(ไม่มีรหัส)"));
      return;
    }

    const credit = subjectCredits[code];
    weightedTotal += grade * credit;
    creditTotal += credit;
  });

  return {
    gpa: creditTotal > 0 ? weightedTotal / creditTotal : null,
    creditTotal,
    unmatchedCodes: [...unmatchedCodes]
  };
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

async function searchStudent() {
  const inputId = normalizeStudentId(
    document.getElementById("studentId").value
  );

  const resultDiv = document.getElementById("result");
  const gradeTableBody = document.getElementById("gradeTableBody");
  const studentName = document.getElementById("studentName");
  const studentYear = document.getElementById("studentYear");
  const noteRemark = document.getElementById("noteRemark");
  const gpaSummary = document.getElementById("gpaSummary");
  const gpaValue = document.getElementById("gpaValue");
  const gpaDetail = document.getElementById("gpaDetail");

  resultDiv.style.display = "block";
  noteRemark.style.display = "none";
  gpaSummary.style.display = "none";
  gpaValue.textContent = "-";
  gpaDetail.textContent = "";
  gradeTableBody.innerHTML = "";
  studentName.textContent = "";
  studentYear.textContent = "";

  if (!inputId) {
    studentName.textContent = "กรุณากรอกรหัสนักเรียน";
    return;
  }

  try {
    /*
      แต่ละไฟล์ m2-1.json ถึง m2-6.json แทนข้อมูลของแต่ละห้อง
      ในแต่ละไฟล์มีทั้งรายวิชาและกิจกรรมอยู่ด้วยกันแล้ว
      โหลดเฉพาะไฟล์ที่มีอยู่จริง โดยข้ามไฟล์ที่ยังไม่มี แล้วค้นหารหัสจากข้อมูลรวม
    */
    const fileNames = [
      "data/m2-1.json",
      "data/m2-2.json",
      "data/m2-3.json",
      "data/m2-4.json",
      "data/m2-5.json",
      "data/m2-6.json"
    ];

    // โหลดแต่ละไฟล์แยกกัน: ไฟล์ที่ยังไม่มี (404) จะถูกข้าม
    // จึงใช้ข้อมูลจากห้องที่มีไฟล์อยู่แล้วได้ ไม่ต้องรอให้ครบทั้ง 6 ห้อง
    const results = await Promise.all(
      fileNames.map(async url => {
        try {
          const response = await fetch(url);

          if (!response.ok) {
            console.warn(`ข้ามไฟล์ ${url}: HTTP ${response.status}`);
            return { url, data: null, error: `HTTP ${response.status}` };
          }

          const json = await response.json();
          if (!Array.isArray(json)) {
            console.warn(`ข้ามไฟล์ ${url}: รูปแบบ JSON ไม่ใช่อาร์เรย์`);
            return { url, data: null, error: "รูปแบบ JSON ไม่ถูกต้อง" };
          }

          return { url, data: json, error: null };
        } catch (err) {
          console.warn(`ข้ามไฟล์ ${url}:`, err);
          return { url, data: null, error: err.message || "โหลดไม่สำเร็จ" };
        }
      })
    );

    const availableFiles = results.filter(item => item.data !== null);

    if (availableFiles.length === 0) {
      throw new Error(
        "ไม่พบไฟล์ JSON ที่โหลดได้ กรุณาตรวจสอบชื่อและตำแหน่งไฟล์ในโฟลเดอร์ data"
      );
    }

    const allData = availableFiles.flatMap(item => item.data);

    // ค้นหาทุกรายการของนักเรียน โดยรองรับทั้งฟิลด์ id และ student_code
    // เพื่อไม่ให้รายวิชาตกหล่น หากข้อมูลแต่ละชุดเก็บรหัสไว้คนละฟิลด์
    const studentData = allData.filter(item => {
      const id = normalizeStudentId(item.id);
      const studentCode = normalizeStudentId(item.student_code);
      return id === inputId || studentCode === inputId;
    });

    if (studentData.length === 0) {
      studentName.textContent = "❌ ไม่พบข้อมูล";
      studentYear.textContent = "";
      return;
    }

    const student = studentData[0];
    const year = student.year ?? "";
    const room = student.room ?? "";

    studentName.textContent = "ชื่อ: " + (student.name ?? "-") +
      "   ชั้น: ม.2" + (room !== "" ? "/" + room : "");

    studentYear.textContent = "ภาคเรียนที่ 1 ปีการศึกษา 2569";

    // หมายเหตุแสดงเฉพาะเมื่อมีอย่างน้อยหนึ่งรายการที่ score เท่ากับ "ร"
    // เงื่อนไขนี้ไม่กรองรายวิชา ตารางยังแสดง studentData ทุกรายการ
    const hasR = studentData.some(item =>
      String(item.score ?? "").trim() === "ร"
    );
    noteRemark.style.display = hasR ? "block" : "none";

    // คำนวณ GPA จากเกรดตัวเลขใน score; หากมี ร ก็คิดเฉพาะวิชาที่มีเกรดตัวเลข
    const gpaResult = calculateGpa(studentData);
    gpaSummary.style.display = "block";
    if (gpaResult.gpa === null) {
      gpaValue.textContent = "ยังคำนวณไม่ได้";
      gpaDetail.textContent = "ไม่พบเกรดตัวเลขที่จับคู่หน่วยกิตได้";
    } else {
      gpaValue.textContent = gpaResult.gpa.toFixed(2);
      gpaDetail.textContent = "คำนวณจาก " + gpaResult.creditTotal + " หน่วยกิต";
    }
    if (gpaResult.unmatchedCodes.length > 0) {
      const warning = document.createElement("div");
      warning.style.color = "red";
      warning.style.fontSize = "14px";
      warning.style.fontWeight = "normal";
      warning.style.marginTop = "6px";
      warning.textContent = "รหัสวิชาที่ไม่มีหน่วยกิตกำหนด จึงไม่นำมาคำนวณ: " + gpaResult.unmatchedCodes.join(", ");
      gpaDetail.appendChild(document.createElement("br"));
      gpaDetail.appendChild(warning);
    }

    let rows = "";

    studentData.forEach(item => {
      const subjectName = String(item.subject_name ?? "").trim();
      const isActivity = subjectName.includes("กิจกรรม");

      // อ่านผลการเรียน/ผลกิจกรรมจากคอลัมน์ score เท่านั้น
      // ไม่คำนวณเกรด และไม่ใช้ค่าจากคอลัมน์ grade หรือ result
      const hasScore =
        item.score !== undefined &&
        item.score !== null &&
        String(item.score).trim() !== "";

      const resultText = hasScore ? String(item.score).trim() : "-";
      let className = "";

      if (["ผ่าน", "ผ"].includes(resultText)) {
        className = "pass";
      } else if (["ไม่ผ่าน", "มผ", "ร", "มส", "ขส"].includes(resultText)) {
        className = "fail";
      }

      rows += `
        <tr>
          <td>${escapeHtml(item.subject_code || "-")}</td>
          <td>${escapeHtml(subjectName || "-")}</td>
          <td class="${className}">${escapeHtml(resultText)}</td>
        </tr>
      `;
    });

    gradeTableBody.innerHTML = rows;

  } catch (error) {
    console.error("เกิดข้อผิดพลาดในการโหลดข้อมูล:", error);
    studentName.textContent = "โหลดข้อมูลไม่สำเร็จ";
    studentYear.textContent = error.message;
  }
}
</script>

<body>

<div class="container">
  <img src="logo.png" class="logo">
  <h2><i class="fa-solid fa-clipboard-check education-icon kindergarten"></i> ตรวจสอบผลการเรียน อนุบาล 2</h2>

  <input
    type="text"
    id="studentId"
    placeholder="กรอกเลขบัตรประชาชน"
    inputmode="numeric"
    autocomplete="off"
  >

  <br>

  <button onclick="searchStudent()">ค้นหา</button>

  <div id="result" style="display:none;">

    <div class="info">
      <p id="studentName"></p>
    </div>

    <div class="semester">
      <p id="studentYear"></p>
    </div>

    <table id="gradeTable" style="display:none;">
      <thead>
        <tr>
          <th>ชื่อวิชา</th>
          <th>คะแนน</th>
        </tr>
      </thead>
      <tbody id="gradeTableBody"></tbody>
    </table>

    <div class="rank-text" id="studentRank"></div>

    <div class="message" id="messageBox"></div>

  </div>
</div>

<script>

function normalizeId(id) {
  if (id === null || id === undefined) return "";

  const thaiToArabic = {
    "๐": "0",
    "๑": "1",
    "๒": "2",
    "๓": "3",
    "๔": "4",
    "๕": "5",
    "๖": "6",
    "๗": "7",
    "๘": "8",
    "๙": "9"
  };

  return String(id)
    .trim()
    .replace(/\s+/g, "")
    .replace(/[๐-๙]/g, function(ch) {
      return thaiToArabic[ch];
    });
}


function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


async function searchStudent() {

  const inputId =
    normalizeId(document.getElementById("studentId").value);

  const resultDiv =
    document.getElementById("result");

  const gradeTable =
    document.getElementById("gradeTable");

  const tableBody =
    document.getElementById("gradeTableBody");

  const studentNameEl =
    document.getElementById("studentName");

  const studentYearEl =
    document.getElementById("studentYear");

  const studentRankEl =
    document.getElementById("studentRank");

  const messageBox =
    document.getElementById("messageBox");


  // รีเซ็ตหน้าผลลัพธ์
  resultDiv.style.display = "block";
  gradeTable.style.display = "none";
  tableBody.innerHTML = "";
  studentNameEl.innerText = "";
  studentYearEl.innerText = "";
  studentRankEl.innerText = "";
  messageBox.innerText = "";


  if (!inputId) {
    messageBox.innerText = "กรุณากรอกรหัสบัตรประชาชน";
    return;
  }


  try {

    // โหลดข้อมูลจากไฟล์ JSON ที่มีอยู่ โดยไม่บังคับว่าต้องมีครบทั้ง 3 ไฟล์
    const fileNames = [
      "data/k2-1.json",
      "data/k2-2.json"
    ];

    const results = await Promise.all(
      fileNames.map(async fileName => {
        try {
          const response = await fetch(fileName);
          if (!response.ok) return null; // ข้ามไฟล์ที่ไม่มีหรือโหลดไม่ได้

          const jsonData = await response.json();
          return Array.isArray(jsonData) ? jsonData : null;
        } catch (error) {
          return null; // ข้ามไฟล์ที่อ่านไม่ได้
        }
      })
    );

    // รวมเฉพาะข้อมูลจากไฟล์ที่โหลดสำเร็จ
    const dataSets = results.filter(dataSet => Array.isArray(dataSet));

    if (dataSets.length === 0) {
      throw new Error("ไม่พบไฟล์ JSON ที่สามารถโหลดได้");
    }

    const data = dataSets.flat();

    /*
      โครงสร้าง k3-2 มีแถวคะแนนรวมแยกออกมา
      โดยแถวคะแนนรวมจะไม่มี id / name / subject_name

      ดังนั้นเราไม่ใช้ student.total_score
      แต่คำนวณคะแนนรวมจากคะแนนของรายวิชาของนักเรียนโดยตรง
    */

    const studentData = data.filter(item => {

      const sameId =
        normalizeId(item.id) === inputId;

      const hasSubject =
        item.subject_name &&
        String(item.subject_name).trim() !== "";

      const isTotalRow =
        String(item.subject_name || "").trim() === "คะแนนรวม";

      return sameId && hasSubject && !isTotalRow;

    });


    if (studentData.length === 0) {

      messageBox.innerText =
        "❌ ไม่พบข้อมูลนักเรียน";

      return;
    }


    const student = studentData[0];


    // ----------------------------------
    // สร้างชื่อชั้น เช่น อ.3/2
    // ----------------------------------

    const year =
      Number(student.year);

    const room =
      Number(student.room);

    const className =
      `อ.${year}/${room}`;


    studentNameEl.innerText =
      `ชื่อ: ${student.name}   ชั้น: ${className}`;


    studentYearEl.innerText =
      "ภาคเรียนที่ 1 ปีการศึกษา 2569";


    // ----------------------------------
    // แสดงคะแนนแต่ละวิชา
    // ----------------------------------

    let totalScore = 0;


    studentData.forEach(item => {

      const score =
        Number(item.score) || 0;

      totalScore += score;


      const row = document.createElement("tr");

      const subjectCell =
        document.createElement("td");

      const scoreCell =
        document.createElement("td");

      subjectCell.textContent =
        item.subject_name;

      scoreCell.textContent =
        score;

      row.appendChild(subjectCell);
      row.appendChild(scoreCell);

      tableBody.appendChild(row);

    });


    // ----------------------------------
    // คะแนนรวม
    // ----------------------------------

    const totalRow =
      document.createElement("tr");

    totalRow.className =
      "total-row";

    const totalLabel =
      document.createElement("td");

    const totalValue =
      document.createElement("td");

    totalLabel.textContent =
      "คะแนนรวม";

    totalValue.textContent =
      totalScore;

    totalRow.appendChild(totalLabel);
    totalRow.appendChild(totalValue);

    tableBody.appendChild(totalRow);


    gradeTable.style.display =
      "table";


    // ----------------------------------
    // หาจำนวนนักเรียนใน อ.3/2
    // ----------------------------------

    const studentsInRoom =
      data.filter(item => {

        const itemId =
          normalizeId(item.id);

        return (
          itemId !== "" &&
          Number(item.year) === year &&
          Number(item.room) === room
        );

      });


    // นับ id นักเรียนที่ไม่ซ้ำกัน
    const uniqueStudentIds =
      new Set(
        studentsInRoom.map(item =>
          normalizeId(item.id)
        )
      );


    const totalStudents =
      uniqueStudentIds.size;


    // ----------------------------------
    // อันดับในห้อง
    // ----------------------------------

    const rank =
      student.class_rank !== undefined &&
      student.class_rank !== null &&
      student.class_rank !== ""
        ? student.class_rank
        : "-";


    studentRankEl.innerText =
      `อันดับที่/ห้อง : ${rank}/${totalStudents}`;


  } catch (error) {

    console.error(error);

    messageBox.innerText =
      `เกิดข้อผิดพลาดในการโหลดข้อมูล: ${error.message}`;

  }

}


// กด Enter เพื่อค้นหาได้
document.getElementById("studentId")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      searchStudent();
    }

  });

</script>

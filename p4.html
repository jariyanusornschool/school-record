<body>

<div class="container">
  <img src="logo.png" class="logo">
  <h2><i class="fa-solid fa-clipboard-check education-icon kindergarten"></i> ตรวจสอบผลการเรียน ป.4</h2>

  <input type="text" id="studentId" placeholder="กรอกเลขบัตรประชาชน">
  <br>
  <button onclick="searchStudent()">ค้นหา</button>

  <div id="result" style="display:none;">

    <div class="info">
  <p id="studentInfo"></p>
</div>

<p id="studentYear"></p>
    
    <table>
      <thead>
        <tr>
          <th style="width:20%;">รหัสวิชา</th>
          <th style="width:50%;">ชื่อวิชา</th>
          <th style="width:30%;">คะแนน</th>
        </tr>
      </thead>
      <tbody id="gradeTableBody"></tbody>
    </table>

    <p class="rank-text" id="studentRank"></p>


  </div>
</div>

<script>
async function searchStudent() {
  const inputId = document.getElementById("studentId").value.trim();

  if (!inputId) {
    alert("กรุณากรอกเลขบัตรประชาชน");
    return;
  }

  const resultDiv = document.getElementById("result");
  const gradeTableBody = document.getElementById("gradeTableBody");
  const studentInfo = document.getElementById("studentInfo");
  const studentYear = document.getElementById("studentYear");
  const studentRank = document.getElementById("studentRank");

  resultDiv.style.display = "block";
  gradeTableBody.innerHTML = "";
  studentInfo.innerText = "กำลังโหลดข้อมูล...";
  studentYear.innerText = "";
  studentRank.innerText = "";

  try {
    // โหลดข้อมูลจากไฟล์ที่มีอยู่ได้ โดยข้ามไฟล์ที่ไม่มีหรือโหลดไม่สำเร็จ
    const fileNames = [
      "data/p4-1.json",
      "data/p4-2.json",
      "data/p4-3.json",
      "data/p4-4.json"
    ];

    const results = await Promise.allSettled(
      fileNames.map(async fileName => {
        const response = await fetch(fileName);
        if (!response.ok) throw new Error(`${fileName}: HTTP ${response.status}`);
        return await response.json();
      })
    );

    const gradeData = results
      .filter(result => result.status === "fulfilled" && Array.isArray(result.value))
      .flatMap(result => result.value);

    if (gradeData.length === 0) {
      throw new Error("ไม่พบไฟล์ JSON ที่โหลดได้ กรุณาตรวจสอบ data/p1-1.json ถึง data/p1-3.json");
    }

    // ค้นหานักเรียนจากข้อมูลที่รวมจากไฟล์ที่โหลดสำเร็จ
    const studentGrades = gradeData.filter(
      item => String(item.id ?? "").trim() === inputId &&
              String(item.subject_name ?? "").trim() !== "คะแนนรวม"
    );

    if (studentGrades.length === 0) {
      studentInfo.innerText = "❌ ไม่พบข้อมูล";
      studentYear.innerText = "";
      studentRank.innerText = "";
      return;
    }

    const student = studentGrades[0];
    const name = student.name || "-";
    const yearRoom = student.year_room ||
      (student.year != null && student.room != null
        ? `ป.${student.year}/${student.room}`
        : "ป.4");

    studentInfo.innerText = `ชื่อ: ${name} ชั้น: ${yearRoom}`;
    studentYear.innerText = "ภาคเรียนที่ 1 ปีการศึกษา 2569";

    // แสดงอันดับจาก class_rank และนับจำนวนนักเรียนในห้องจาก id ที่ไม่ซ้ำกัน
    // แต่ละคนอาจมีหลายแถวตามจำนวนวิชา จึงนับ id เดิมเป็น 1 คน
    const rank = student.class_rank !== "" && student.class_rank != null
      ? student.class_rank : "-";

    const studentIdsInRoom = new Set(
      gradeData
        .filter(item =>
          Number(item.year) === Number(student.year) &&
          Number(item.room) === Number(student.room) &&
          String(item.id ?? "").trim() !== "" &&
          String(item.subject_name ?? "").trim() !== "คะแนนรวม"
        )
        .map(item => String(item.id).trim())
    );
    const totalStudents = studentIdsInRoom.size;
    studentRank.innerText = `อันดับที่/ห้อง : ${rank}/${totalStudents}`;

    gradeTableBody.innerHTML = studentGrades.map(item => `
      <tr>
        <td>${escapeHtml(item.subject_code ?? "-")}</td>
        <td>${escapeHtml(item.subject_name ?? "-")}</td>
        <td>${escapeHtml(item.score ?? "-")}</td>
      </tr>
    `).join("");

  } catch (error) {
    console.error("เกิดข้อผิดพลาด:", error);
    studentInfo.innerText = "ไม่สามารถโหลดข้อมูลได้ กรุณาตรวจสอบไฟล์ JSON";
    studentYear.innerText = "";
    studentRank.innerText = error.message;
  }
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

document.getElementById("studentId").addEventListener("keydown", function(event) {
  if (event.key === "Enter") searchStudent();
});
</script>
